<div class="login-container d-flex align-items-center" style="min-height: 100vh; justify-content: center; background-color: var(--bg-color);">
  <div class="card" style="width: 100%; max-width: 400px;">
    <h2 class="text-center mb-3">System Login</h2>
    <hr style="margin-bottom: 20px; border: 0; border-top: 1px solid var(--border-color);">
    
    <div *ngIf="errorMessage" class="alert alert-danger" style="color: var(--danger-color); font-size: 14px; margin-bottom: 15px; text-align: center;">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="userId">User ID</label>
        <input type="text" id="userId" class="form-control" formControlName="userId" placeholder="Enter User ID">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" formControlName="password" placeholder="Enter Password">
      </div>

      <div class="form-group">
        <label for="role">Role</label>
        <select id="role" class="form-control" formControlName="role">
          <option value="General User">General User</option>
          <option value="Admin">Admin</option>
        </select>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary" style="width: 100%;" [disabled]="loginForm.invalid || isLoading">
          <span *ngIf="isLoading">Authenticating...</span>
          <span *ngIf="!isLoading">Login</span>
        </button>
      </div>
      
    </form>
    
    <div style="margin-top: 20px; font-size: 12px; text-align: center; color: #7f8c8d;">
      <p>Test Accounts:</p>
      <p>Admin: admin1 / password123</p>
      <p>User: user1 / password123</p>
    </div>

  </div>
</div>
