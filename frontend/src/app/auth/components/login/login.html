<div class="login-wrapper">
  <div class="login-card">
    <h2 class="login-title">System Login</h2>
    <hr>
    
    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="userId">User ID</label>
        <input 
          type="text" 
          id="userId" 
          class="form-control" 
          formControlName="userId" 
          placeholder="Enter User ID">
        <div *ngIf="loginForm.get('userId')?.touched && loginForm.get('userId')?.invalid" style="color: #e74c3c; font-size: 12px; margin-top: 4px;">
          User ID is required.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          class="form-control" 
          formControlName="password" 
          placeholder="Enter Password">
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" style="color: #e74c3c; font-size: 12px; margin-top: 4px;">
          Password is required.
        </div>
      </div>

      <div class="form-group">
        <label for="role">Role</label>
        <select id="role" class="form-control" formControlName="role">
          <option value="General User">General User</option>
          <option value="Admin">Admin</option>
        </select>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary" style="width: 100%;" [disabled]="loginForm.invalid || isLoading">
          <span *ngIf="isLoading">Authenticating...</span>
          <span *ngIf="!isLoading">Login</span>
        </button>
      </div>
      
    </form>
    
    <div class="test-accounts">
      <p><strong>Test Accounts:</strong></p>
      <p>Admin: admin1 / password123</p>
      <p>User: user1 / password123</p>
    </div>

  </div>
</div>
