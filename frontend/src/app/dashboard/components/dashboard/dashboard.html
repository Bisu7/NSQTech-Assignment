<div class="dashboard-layout">
  
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h3>Internal Systems</h3>
    </div>
    <ul class="sidebar-nav">
      <li class="active"><a routerLink="/dashboard">Dashboard</a></li>
      <li *ngIf="user?.role === 'Admin'"><a routerLink="/admin">Admin Panel</a></li>
    </ul>
    <div class="sidebar-footer">
      <p>Logged in as:</p>
      <div class="user-profile">
        <strong>{{ user?.name }}</strong>
        <span>{{ user?.role }}</span>
      </div>
      <button class="btn btn-danger mt-3" (click)="logout()" style="width: 100%;">Logout</button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    
    <!-- Navbar -->
    <header class="navbar">
      <div class="navbar-brand">
        <h2>Records Management</h2>
      </div>
      <div class="navbar-actions">
        <span *ngIf="loader.isLoading$ | async" class="loading-spinner">
          Loading Data...
        </span>
      </div>
    </header>

    <!-- Content Area -->
    <section class="content-area">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center mb-3">
          <h3 style="margin: 0;">{{ user?.role === 'Admin' ? 'All System Records' : 'My Assigned Records' }}</h3>
          <div>
            <button *ngIf="user?.role === 'Admin'" class="btn btn-primary" style="margin-right: 10px;" (click)="openAddRecordModal()">+ Add New Record</button>
            <button class="btn btn-secondary" (click)="fetchRecords()" [disabled]="loader.isLoading$ | async">Refresh</button>
          </div>
        </div>
        
        <app-table 
          [records]="records" 
          [isLoading]="(loader.isLoading$ | async) || false"
          [showActions]="user?.role === 'Admin'"
          (edit)="openEditRecordModal($event)"
          (delete)="onDeleteRecord($event)"
        ></app-table>
        
      </div>
    </section>

  </main>
</div>

<!-- Add/Edit Record Modal -->
<div class="modal-overlay" *ngIf="showRecordModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>{{ isEditing ? 'Edit Record' : 'Add New Record' }}</h2>
      <button class="btn-close" (click)="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="alert alert-danger" *ngIf="formError">{{ formError }}</div>
      
      <form [formGroup]="recordForm" (ngSubmit)="onRecordSubmit()">
        <div class="form-group">
          <label>Record Title</label>
          <input type="text" class="form-control" formControlName="title" placeholder="Enter record title">
        </div>

        <div class="form-group mt-2">
          <label>Description</label>
          <input type="text" class="form-control" formControlName="description" placeholder="Enter brief description">
        </div>

        <div class="form-group mt-2">
          <label>Access Level</label>
          <select class="form-control" formControlName="accessLevel">
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
            <option value="Confidential">Confidential</option>
            <option value="Public">Public</option>
            <option value="Restricted">Restricted</option>
            <option value="Internal">Internal</option>
          </select>
        </div>

        <div class="form-group mt-2">
          <label>Assign to User</label>
          <select class="form-control" formControlName="assignedUser">
            <option value="">-- Select a User --</option>
            <option *ngFor="let u of users" [value]="u._id">{{ u.name }} ({{ u.role }})</option>
          </select>
        </div>

        <div class="modal-footer mt-4 text-right">
          <button type="button" class="btn btn-secondary" style="margin-right: 10px;" (click)="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="recordForm.invalid || (loader.isLoading$ | async)">
            {{ isEditing ? 'Update Record' : 'Save Record' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
