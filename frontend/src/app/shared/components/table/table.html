<div class="table-responsive">
  <table class="table corporate-table">
    <thead>
      <tr>
        <th *ngFor="let col of columns">{{ col }}</th>
        <th *ngIf="showActions" style="width: 150px; text-align: center;">Actions</th>
      </tr>
    </thead>
    <tbody>
      <!-- Skeleton Loading State -->
      <ng-container *ngIf="isLoading">
        <tr *ngFor="let i of [1,2,3,4,5]">
          <td *ngFor="let col of columns">
            <div class="skeleton-box"></div>
          </td>
          <td *ngIf="showActions">
            <div class="skeleton-box" style="width: 80px; margin: 0 auto;"></div>
          </td>
        </tr>
      </ng-container>

      <!-- Actual Data State -->
      <ng-container *ngIf="!isLoading">
        <tr *ngFor="let record of records">
          <td>{{ record.title }}</td>
          <td>{{ record.description }}</td>
          <td>
            <span class="badge" [ngClass]="{'badge-high': record.accessLevel === 'High', 'badge-medium': record.accessLevel === 'Medium', 'badge-low': record.accessLevel === 'Low'}">
              {{ record.accessLevel }}
            </span>
          </td>
          <td>{{ record.assignedUser?.name || 'N/A' }}</td>
          <td *ngIf="showActions" class="actions-cell text-center">
            <button class="btn btn-sm btn-edit" (click)="onEdit(record)">Edit</button>
            <button class="btn btn-sm btn-delete" (click)="onDelete(record._id)">Delete</button>
          </td>
        </tr>
        <tr *ngIf="records.length === 0">
          <td [attr.colspan]="columns.length + (showActions ? 1 : 0)" class="text-center text-muted" style="padding: 20px;">
            No records found.
          </td>
        </tr>
      </ng-container>
    </tbody>
  </table>
</div>
